services:
  watermark:
    build:
      context: .
      dockerfile: Dockerfile
    image: watermark:latest
    container_name: watermark-app
    ports:
      - "8088:80"
    volumes:
      - nginx-logs:/var/log/nginx
    labels:
      - "org.opencontainers.image.title=WaterMark PWA"
      - "org.opencontainers.image.description=100% client-side security watermark for PDFs and images"
      - "org.opencontainers.image.source=https://github.com/Hichiro6/watermark"
      - "org.opencontainers.image.licenses=CC-BY-NC-ND-4.0"
      - "org.opencontainers.image.version=1.0.0"
      - "maintainer=Hichiro <@Hichiro6>"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/index.html"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped

volumes:
  nginx-logs:
    driver: local
